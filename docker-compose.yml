services:
# Pi-Hole service
  # More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "8080:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      - "4443:443/tcp"
      # Uncomment the below if using Pi-hole as your DHCP Server
      #- "67:67/udp"
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: 'Europe/Paris'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: 'password'
      FTLCONF_dns_listeningMode: 'all' # Make sure to listen to all DNS requests
      FTLCONF_dns_upstreams: '1.1.1.1;1.0.0.1'
      #FTLCONF_dns_upstreams: 'unbound'
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - './container-data/etc-pihole:/etc/pihole'
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
    restart: always

# Polaris service
  polaris:
    container_name: polaris
    image: registry.gitlab.com/connectical/container/polaris
    ports:
      - "5050:5050/tcp"
    volumes:
      # For load music in app
      - '/mnt/data/music:/music'
      # For persisting Pi-hole's databases and common configuration file
      - './container-data/polaris/cache:/var/cache/polaris'
      - './container-data/polaris/data:/var/lib/polaris'
    restart: always

# Honeygain service
  honeygain:
    container_name: honeygain
    image: 'honeygain/honeygain:latest'
    command: '-tou-accept -email mail@example.com -pass password -device raspberry'
    restart: always

# Miniflux service
  miniflux:
    container_name: miniflux
    image: miniflux/miniflux:latest
    ports:
      - "5060:8080/tcp"
    depends_on:
      miniflux-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://miniflux:secret@miniflux-db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=password
    restart: always
  miniflux-db:
    container_name: miniflux-db
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=miniflux
    volumes:
      - './container-data/miniflux/data:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
